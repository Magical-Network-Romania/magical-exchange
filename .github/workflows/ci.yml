name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          cache: maven
          distribution: temurin
          java-version: "21"
      - name: Verify backend
        run: mvn -f services/backend/pom.xml verify

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check web
        run: bun run web:check
      - name: Typecheck web
        run: bun run web:typecheck
      - name: Build web
        run: bun run web:build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - backend
      - web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -f services/backend/Dockerfile -t magical-exchange-backend:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t magical-exchange-web:ci .
      - name: Validate Compose file
        run: docker compose -f infra/compose.local.yml config
      - name: Validate Dokploy Compose file
        env:
          BACKEND_IMAGE: ghcr.io/Magical-Network-Romania/magical-exchange-backend:latest
          POSTGRES_DB: magical_exchange
          POSTGRES_PASSWORD: magical_exchange
          POSTGRES_USER: magical_exchange
          WEB_IMAGE: ghcr.io/Magical-Network-Romania/magical-exchange-web:latest
        run: docker compose -f infra/compose.dokploy.yml config
