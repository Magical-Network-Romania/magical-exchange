name: magical-exchange-local

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magical_exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magical_exchange}
      POSTGRES_USER: ${POSTGRES_USER:-magical_exchange}
    healthcheck:
      interval: 10s
      retries: 20
      start_period: 60s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      timeout: 5s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql

  backend:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-magical_exchange}
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-magical_exchange}
      DATABASE_USERNAME: ${POSTGRES_USER:-magical_exchange}
      MAGICAL_EXCHANGE_INGESTION_ENABLED: ${MAGICAL_EXCHANGE_INGESTION_ENABLED:-true}
      MAGICAL_EXCHANGE_INGESTION_FIXED_DELAY_MS: ${MAGICAL_EXCHANGE_INGESTION_FIXED_DELAY_MS:-3600000}
      MAGICAL_EXCHANGE_INGESTION_STARTUP_ENABLED: ${MAGICAL_EXCHANGE_INGESTION_STARTUP_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  database_data:
