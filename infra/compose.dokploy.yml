name: magical-exchange

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
    healthcheck:
      interval: 10s
      retries: 20
      start_period: 60s
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      timeout: 5s
    networks:
      - magical_exchange_internal
    volumes:
      - database_data:/var/lib/postgresql

  backend:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
      MAGICAL_EXCHANGE_INGESTION_ENABLED: ${MAGICAL_EXCHANGE_INGESTION_ENABLED:-true}
      MAGICAL_EXCHANGE_INGESTION_FIXED_DELAY_MS: ${MAGICAL_EXCHANGE_INGESTION_FIXED_DELAY_MS:-3600000}
      MAGICAL_EXCHANGE_INGESTION_STARTUP_ENABLED: ${MAGICAL_EXCHANGE_INGESTION_STARTUP_ENABLED:-true}
    expose:
      - "8080"
    networks:
      - dokploy-network
      - magical_exchange_internal

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
  magical_exchange_internal:
    internal: true

volumes:
  database_data:
